<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddy Game - Platform Adventure</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" tabindex="0"></canvas>
        <div id="hud">
            <div id="hud-left">
                <span id="lives"></span>
                <span id="score">Puntos: 0</span>
                <span id="ammo"></span>
            </div>
            <div id="hud-center">
                <span id="level">LEVEL 1</span>
            </div>
            <div id="hud-right">
                <span id="collectibles"></span>
            </div>
        </div>
        <div id="overlay">
            <div id="overlay-content">
                <h1 id="overlay-title">FREDDY GAME</h1>
                <p id="overlay-subtitle">A Platform Adventure</p>
                <div id="overlay-divider"></div>
                <p id="overlay-text">Press ENTER to start</p>
                <div id="overlay-stars"></div>
                <div id="overlay-score"></div>
                <div id="controls-info">
                    <div class="key-row">
                        <span class="key">W</span>
                        <span class="key-desc">Saltar (x2, en pared)</span>
                    </div>
                    <div class="key-row">
                        <span class="key">A</span><span class="key">D</span>
                        <span class="key-desc">Moverse</span>
                    </div>
                    <div class="key-row">
                        <span class="key">S</span>
                        <span class="key-desc">Agacharse / caída rápida</span>
                    </div>
                    <div class="key-row">
                        <span class="key">SHIFT</span>
                        <span class="key-desc">Dash (invulnerable)</span>
                    </div>
                    <div class="key-row">
                        <span class="key">SPC</span>
                        <span class="key-desc">Papel (mantener: rollo gigante)</span>
                    </div>
                    <div class="key-row">
                        <span class="key">F</span>
                        <span class="key-desc">Desatascador (para proyectiles)</span>
                    </div>
                    <div class="key-row">
                        <span class="key">ESC</span>
                        <span class="key-desc">Pausa</span>
                    </div>
                    <div class="key-row">
                        <span class="key">R</span>
                        <span class="key-desc">Reiniciar nivel</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/assets.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/projectile.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/collectible.js"></script>
    <script src="js/player.js"></script>
    <script src="js/scenery.js"></script>
    <script src="js/level.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
